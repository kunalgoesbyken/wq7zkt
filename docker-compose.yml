services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
